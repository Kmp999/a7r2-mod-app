name: Build Fuji-Lite A7R2 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Android Build Tools, Platform and Legacy NDK r14b (Sony PMCA ABI/API-9 Compatible)
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-15" "build-tools;28.0.3"
          if [ ! -e /usr/lib/x86_64-linux-gnu/libncurses.so.5 ] && [ -e /usr/lib/x86_64-linux-gnu/libncursesw.so.6 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libncursesw.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ -e /usr/lib/x86_64-linux-gnu/libtinfo.so.6 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          curl -fSL https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip -o /tmp/ndk-r14b.zip
          unzip -q /tmp/ndk-r14b.zip -d $HOME
          rm -f /tmp/ndk-r14b.zip

      - name: Set up Java 8 (Dalvik Target Compatible)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Compile Native C Engine (libcolor_engine_jni.so for armeabi & armeabi-v7a)
        run: |
          $HOME/android-ndk-r14b/ndk-build NDK_PROJECT_PATH=.
          echo "=== Verifying ELF dynamic dependencies & symbols ==="
          readelf -d libs/armeabi/libcolor_engine_jni.so
          readelf -d libs/armeabi-v7a/libcolor_engine_jni.so
          nm -D -u libs/armeabi-v7a/libcolor_engine_jni.so

      - name: Host C Self-Test (4:2:2 Sony / DRI / 4:2:0 / 4:4:4 / 1:2 Scaled Fast YCbCr LUT Transcoder + EXIF)
        run: |
          python3 -m pip install --quiet pillow numpy || true
          cat << 'EOF' > /tmp/test_fast_stream.c
          #include <stdio.h>
          #include <stdlib.h>
          #include "lut_cube_17.h"
          #include "native_jpeg_fast_stream.h"
          int main(int argc, char** argv) {
              if (argc < 4) return 2;
              Lut17Context lut;
              int16_t id_ccm[9] = {256,0,0, 0,256,0, 0,0,256};
              uint8_t id_curve[256];
              for (int i = 0; i < 256; i++) id_curve[i] = (uint8_t)i;
              if (argc >= 5 && argv[4][0] != '\0') {
                  FILE* lf = fopen(argv[4], "rb");
                  if (!lf) return 3;
                  uint8_t base[14739];
                  if (fread(base, 1, sizeof(base), lf) != sizeof(base)) { fclose(lf); return 4; }
                  fclose(lf);
                  lut17_precompute_with_base(&lut, base, id_ccm, id_curve, id_curve, id_curve);
              } else {
                  lut17_precompute(&lut, id_ccm, id_curve, id_curve, id_curve);
              }
              int scale = atoi(argv[3]);
              int grain = (argc >= 6) ? atoi(argv[5]) : 0;
              int clarity = (argc >= 7) ? atoi(argv[6]) : 0;
              FastTranscodeResult res;
              int rc = native_fast_transcode_jpeg_ex(&lut, argv[1], argv[2], scale, 88, grain, clarity, &res);
              if (rc <= 0 || res.preview_rgb565 == NULL || res.preview_w <= 0 || res.preview_h <= 0) {
                  fprintf(stderr, "native_fast_transcode_jpeg_ex failed rc=%d prev=%p (%dx%d)\n",
                          rc, (void*)res.preview_rgb565, res.preview_w, res.preview_h);
                  free(res.preview_rgb565);
                  return 1;
              }
              free(res.preview_rgb565);
              return 0;
          }
          EOF
          gcc -std=gnu99 -O2 -Wall -Werror -Wno-unused-const-variable -pthread -Isrc/color -Isrc/image \
            /tmp/test_fast_stream.c src/image/native_jpeg_fast_stream.c src/image/native_jpeg_writer.c \
            -o /tmp/test_fast_stream
          python3 - << 'PYEOF'
          import subprocess, numpy as np
          from PIL import Image, ImageDraw
          def make_img(w, h):
              arr = np.zeros((h, w, 3), dtype=np.uint8)
              xs = np.linspace(0, 255, w, dtype=np.uint8)
              ys = np.linspace(0, 255, h, dtype=np.uint8)
              arr[:, :, 0] = xs[None, :]
              arr[:, :, 1] = ys[:, None]
              arr[:, :, 2] = 128
              im = Image.fromarray(arr)
              d = ImageDraw.Draw(im)
              d.rectangle([40, 40, 140, 140], fill=(230, 40, 40))
              d.rectangle([160, 60, 260, 160], fill=(40, 210, 60))
              d.rectangle([280, 80, 380, 180], fill=(30, 80, 240))
              return im
          for name, w, h, sub, scale, extra in [
              ("sony_422", 528, 344, 1, 1, {}),
              ("sony_422_dri", 528, 344, 1, 1, {"restart_marker_rows": 1}),
              ("std_420", 528, 344, 2, 1, {}),
              ("full_444", 320, 232, 0, 1, {}),
              ("scale2_422", 1040, 688, 1, 2, {}),
          ]:
              src_im = make_img(w, h)
              exif = src_im.getexif()
              exif[0x0112] = 6
              exif[0x0132] = "2026:11:20 21:00:00"
              in_p = f"/tmp/in_{name}.jpg"
              out_p = f"/tmp/out_{name}.jpg"
              try:
                  src_im.save(in_p, format="JPEG", quality=95, subsampling=sub, exif=exif, **extra)
              except TypeError:
                  src_im.save(in_p, format="JPEG", quality=95, subsampling=sub, exif=exif)
              subprocess.check_call(["/tmp/test_fast_stream", in_p, out_p, str(scale)])
              out_im = Image.open(out_p)
              out_im.load()
              exp_size = (w // scale, h // scale)
              assert out_im.size == exp_size, f"{name}: {out_im.size} != {exp_size}"
              out_exif = out_im.getexif()
              assert out_exif.get(0x0112) == 6, f"{name}: orientation lost: {out_exif.get(0x0112)}"
              ref = src_im if scale == 1 else src_im.resize(exp_size, Image.BOX)
              mae = float(np.mean(np.abs(np.array(ref, dtype=np.float32) - np.array(out_im, dtype=np.float32))))
              print(f"PASS {name}: size={out_im.size}, orientation={out_exif.get(0x0112)}, MAE={mae:.2f}")
              assert mae < 4.0, f"{name}: MAE too high: {mae}"
          # Also test real Classic_Chrome.lut + WEAK grain + clarity on Sony 4:2:2
          subprocess.check_call(["/tmp/test_fast_stream", "/tmp/in_sony_422.jpg", "/tmp/out_cc.jpg", "1", "assets/presets/Classic_Chrome.lut", "1", "2"])
          cc_im = Image.open("/tmp/out_cc.jpg")
          cc_im.load()
          assert cc_im.size == (528, 344)
          print(f"PASS classic_chrome_grain_clarity: size={cc_im.size}")
          PYEOF

      - name: Prepare APK Build Directories
        run: |
          mkdir -p bin/classes
          mkdir -p bin/res
          mkdir -p res
          mkdir -p libs/armeabi
          mkdir -p libs/armeabi-v7a

      - name: Process Resources and Generate R.java
        run: |
          AAPT=$ANDROID_HOME/build-tools/28.0.3/aapt
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          $AAPT package -f -m \
            -J src \
            -M AndroidManifest.xml \
            -S res \
            -I $PLATFORM

      - name: Compile Java Sources (Targeting Java 7 / Dalvik API 10/14)
        run: |
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          find src -name "*.java" > sources.txt
          javac -source 1.7 -target 1.7 \
            -bootclasspath $PLATFORM \
            -d bin/classes \
            @sources.txt

      - name: Convert Class Files to Dalvik Executable (classes.dex)
        run: |
          $ANDROID_HOME/build-tools/28.0.3/dx --dex --output=bin/classes.dex bin/classes

      - name: Package Unaligned APK
        run: |
          AAPT=$ANDROID_HOME/build-tools/28.0.3/aapt
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          $AAPT package -f \
            -M AndroidManifest.xml \
            -S res \
            -A assets \
            -I $PLATFORM \
            -F bin/unaligned.apk

          cd bin
          $AAPT add unaligned.apk classes.dex
          cd ..
          mkdir -p lib/armeabi lib/armeabi-v7a
          cp libs/armeabi/libcolor_engine_jni.so lib/armeabi/
          cp libs/armeabi-v7a/libcolor_engine_jni.so lib/armeabi-v7a/
          $AAPT add bin/unaligned.apk lib/armeabi/libcolor_engine_jni.so
          $AAPT add bin/unaligned.apk lib/armeabi-v7a/libcolor_engine_jni.so

      - name: Sign APK (Strict v1 JAR Signing for Sony PMCA)
        run: |
          jarsigner -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore build/debug.keystore -storepass android -keypass android \
            bin/unaligned.apk androiddebugkey

      - name: ZipAlign Signed APK
        run: |
          $ANDROID_HOME/build-tools/28.0.3/zipalign -f -v -p 4 bin/unaligned.apk fuji-lite-a7r2.apk

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fuji-lite-a7r2-apk
          path: fuji-lite-a7r2.apk
          retention-days: 14
