name: Build Fuji-Lite A7R2 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Android Build Tools, Platform and NDK
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-15" "build-tools;28.0.3" "ndk;21.4.7075529"

      - name: Set up Java 8 (Dalvik Target Compatible)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Compile Native C Engine (libcolor_engine_jni.so)
        run: |
          $ANDROID_HOME/ndk/21.4.7075529/ndk-build NDK_PROJECT_PATH=.

      - name: Prepare APK Build Directories
        run: |
          mkdir -p bin/classes
          mkdir -p bin/res
          mkdir -p res
          mkdir -p libs/armeabi-v7a

      - name: Process Resources and Generate R.java
        run: |
          AAPT=$ANDROID_HOME/build-tools/28.0.3/aapt
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          $AAPT package -f -m \
            -J src \
            -M AndroidManifest.xml \
            -S res \
            -I $PLATFORM

      - name: Compile Java Sources (Targeting Java 7 / Dalvik API 10/14)
        run: |
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          find src -name "*.java" > sources.txt
          javac -source 1.7 -target 1.7 \
            -bootclasspath $PLATFORM \
            -d bin/classes \
            @sources.txt

      - name: Convert Class Files to Dalvik Executable (classes.dex)
        run: |
          $ANDROID_HOME/build-tools/28.0.3/dx --dex --output=bin/classes.dex bin/classes

      - name: Package Unaligned APK
        run: |
          AAPT=$ANDROID_HOME/build-tools/28.0.3/aapt
          PLATFORM=$ANDROID_HOME/platforms/android-15/android.jar
          $AAPT package -f \
            -M AndroidManifest.xml \
            -S res \
            -I $PLATFORM \
            -F bin/unaligned.apk

          cd bin
          $AAPT add unaligned.apk classes.dex
          cd ..
          mkdir -p lib/armeabi-v7a
          cp libs/armeabi-v7a/libcolor_engine_jni.so lib/armeabi-v7a/
          $AAPT add bin/unaligned.apk lib/armeabi-v7a/libcolor_engine_jni.so

      - name: ZipAlign APK
        run: |
          $ANDROID_HOME/build-tools/28.0.3/zipalign -v -p 4 bin/unaligned.apk bin/fuji-lite-a7r2-aligned.apk

      - name: Sign APK (Strict v1 JAR Signing for Sony PMCA)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 1024 -sigalg SHA1withRSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/28.0.3/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled false \
            --v3-signing-enabled false \
            --out fuji-lite-a7r2.apk \
            bin/fuji-lite-a7r2-aligned.apk

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fuji-lite-a7r2-apk
          path: fuji-lite-a7r2.apk
          retention-days: 14
